# Independent development stack. Never points at Railway or the old local DB.
# Start through scripts/local-dev.sh so the Compose project is always explicit.
services:
  backend:
    build: ./backend
    image: ${VERIFY_LOCAL_BACKEND_IMAGE:-verify-reviewed-backend:local}
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:////data/verify-local.db
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      CORS_ORIGINS: http://127.0.0.1:5176,http://localhost:5176
      CORS_ORIGIN_REGEX: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
    ports:
      - "127.0.0.1:8016:8000"
    volumes:
      - ./backend:/app:ro
      - local_data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: ${VERIFY_LOCAL_FRONTEND_IMAGE:-verify-reviewed-frontend:local}
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    environment:
      # Process values override any stale frontend .env pointing to Railway.
      VITE_API_URL: ""
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5176:5173"
    volumes:
      - ./frontend:/app
      - local_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  local_data:
  local_node_modules:
