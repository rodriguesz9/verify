name: Regression tests (no provider credentials)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      # Each hosted job owns this disposable service, never the Railway DB.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: verify_ci_test
          POSTGRES_USER: verify_test
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify_test -d verify_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install media/PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng libimage-exiftool-perl
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline tests / SQLite
        if: matrix.database == 'sqlite'
        run: python -B scripts/run_offline_tests.py
      - name: Offline tests / disposable PostgreSQL
        if: matrix.database == 'postgres'
        run: python -B scripts/run_offline_tests.py --postgres-test-url postgresql+asyncpg://verify_test:local-ci-test-only@127.0.0.1:5432/verify_ci_test

  frontend:
    name: Frontend / tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

# Deliberately no deploy, secret pull, provider probe or production write.
# Require these checks in repository/deployment settings after first remote run.
