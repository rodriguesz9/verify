version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: verify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: verify_pass
      POSTGRES_DB: verify
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - verify-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verify"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: verify-backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      # O hostname "db" é resolvido pela rede interna do Docker Compose.
      DATABASE_URL: postgresql+asyncpg://verify:verify_pass@db:5432/verify
    depends_on:
      db:
        condition: service_healthy
    networks:
      - verify-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: verify-frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    networks:
      - verify-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  verify-net:
    driver: bridge
